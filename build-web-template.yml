name: Build Island Fight Race web template
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - run: pip install scons
      - name: Get Godot 4.7.2-stable source
        run: git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git godot-src
      - name: Copy the profile
        run: cp custom_engine/ifr_web.build godot-src/ifr_web.build
      - name: Build
        working-directory: godot-src
        run: >
          scons platform=web target=template_release threads=no dlink_enabled=no production=yes optimize=size
          build_profile=ifr_web.build
          module_enet_enabled=no module_upnp_enabled=no module_webrtc_enabled=no module_webxr_enabled=no
          module_openxr_enabled=no module_mobile_vr_enabled=no module_theora_enabled=no module_csg_enabled=no
          module_gridmap_enabled=no module_minimp3_enabled=no module_jsonrpc_enabled=no module_camera_enabled=no
          module_gltf_enabled=no module_fbx_enabled=no module_basis_universal_enabled=no module_tinyexr_enabled=no
      - uses: actions/upload-artifact@v4
        with:
          name: web-template
          path: godot-src/bin/*.zip
